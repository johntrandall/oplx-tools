[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oplx-tools"
version = "0.2.0"
description = "Generate, lint, and parse OmniPlan .oplx files. Companion to the oplx-format spec."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "oplx-tools contributors" }]
requires-python = ">=3.11"
keywords = ["omniplan", "oplx", "project-management", "gantt", "file-format"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyYAML>=6.0",
  "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]
# macOS-only: pyobjc-framework-Cocoa is needed for oplx.bookmark.make_bookmark,
# which generates the <bookmarkData> child of <attachment> elements.
# Skip on non-Mac platforms — .oplx generation works without it as long as
# you're not emitting file:// <attachment> elements.
macos = ["pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'"]

[project.scripts]
oplx = "oplx.cli:main"

[project.urls]
Spec = "https://github.com/johntrandall/oplx-format"
Source = "https://github.com/johntrandall/oplx-tools"
Issues = "https://github.com/johntrandall/oplx-tools/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/oplx"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that drive OmniPlan in a Tart VM (see tests/integration/README.md)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
